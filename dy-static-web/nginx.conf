worker_processes  2;

events {
    worker_connections  1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
              '$status $body_bytes_sent "$http_referer" '
              '"$http_user_agent" "$http_x_forwarded_for" '
              '"$upstream_addr"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    include       mime.types;
    include /etc/nginx/conf.d/*.conf;
    default_type  application/octet-stream;

    server {
        listen       80 default_server;

        set $mobile 0;

        location / {
            if ($http_user_agent ~* '(Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini)') {
                set $mobile 1;
            }

            if ($http_referer ~* www.dy9367) {
                set $mobile '${mobile}9367';
            }

            if ($mobile = 19367) {
                rewrite ^/(.*) https://m.dy9367.com permanent;
            }


            if ($http_referer ~* www.dy8515) {
                set $mobile '${mobile}8515';
            }

            if ($mobile = 18515) {
                rewrite ^/(.*) https://m.dy8515.com permanent;
            }


            if ($http_referer ~* www.dy8169) {
                set $mobile '${mobile}8169';
            }

            if ($mobile = 18169) {
                rewrite ^/(.*) https://m.dy8169.com permanent;
            }


            if ($http_referer ~* www.dy8168) {
                set $mobile '${mobile}8168';
            }

            if ($mobile = 18168) {
                rewrite ^/(.*) https://m.dy8168.com permanent;
            }


            if ($http_referer ~* www.dy6997) {
                set $mobile '${mobile}6997';
            }

            if ($mobile = 16997) {
                rewrite ^/(.*) https://m.dy6997.com permanent;
            }


            if ($http_referer ~* www.dy6918) {
                set $mobile '${mobile}6918';
            }

            if ($mobile = 16918) {
                rewrite ^/(.*) https://m.dy6918.com permanent;
            }


            if ($http_referer ~* www.dy6168) {
                set $mobile '${mobile}6168';
            }

            if ($mobile = 16168) {
                rewrite ^/(.*) https://m.dy6168.com permanent;
            }


            if ($http_referer ~* www.dy5988) {
                set $mobile '${mobile}5988';
            }

            if ($mobile = 15988) {
                rewrite ^/(.*) https://m.dy5988.com permanent;
            }


            if ($http_referer ~* www.dy3158) {
                set $mobile '${mobile}3158';
            }

            if ($mobile = 13158) {
                rewrite ^/(.*) https://m.dy3158.com permanent;
            }


            if ($http_referer ~* www.dy1698) {
                set $mobile '${mobile}1689';
            }

            if ($mobile = 11689) {
                rewrite ^/(.*) https://m.dy1698.com permanent;
            }

            root /usr/share/nginx/html;
            try_files $uri $uri/ @router;
            index  index.html index.htm;
        }

        location @router {
            rewrite ^.*$ /index.html last;
        }

        error_page 404 /404.html;
            location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }
    }
}
