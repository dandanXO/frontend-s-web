<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <title id="main-title">App</title>
    <script src="js/jquery-3.6.1.min.js" type="text/javascript"></script>
	<style>
/* 弹窗样式 */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0, 0, 0, 0.5); /* 半透明黑色背景 */
}

/* 弹窗内容样式 */
.modal-content {
    background-color: white;
    margin: 15% auto;
    padding: 20px;
    border: 1px solid #888;
    width: 80%;
    max-width: 400px;
    border-radius: 5px;
    box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
    text-align: center;
}

/* 关闭按钮样式 */
.close {
    position: absolute;
    top: 10px;
    right: 10px;
    cursor: pointer;
    font-size: 20px;
}

/* 按钮样式 */
.modal-body button {
    background-color: #333;
    color: white;
    border: none;
    padding: 10px 20px;
    text-align: center;
    text-decoration: none;
    display: inline-block;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 20px;
}

/* 按钮悬停样式 */
.modal-body button:hover {
    background-color: #555;
}
</style>
</head>
<body>
<div class="container">
    <div class="wrapper">
        <img class="logo" src="assets/images/logo-desc.png"/>
        <div class="step-1">
            <div class="step-1-action-wrapper">
                <div class="row">
                    <img class="step-1-btn-decor" src="assets/images/step-1-btn-decor.png"/>
                    <button id="step-1-btn" class="step-1-btn"></button>
<!--                    <a target="_blank" href="https://apps.apple.com/us/app/testflight/id899247664?ct=SUWKTUN396"-->
<!--                       class="step-1-btn"></a>-->
                </div>
            </div>
        </div>

        <div class="step-2">
            <div class="step-2-action-wrapper">
                <div class="row">
                    <img class="step-2-btn-decor" src="assets/images/step-2-btn-decor.png"/>
                    <a target="_blank" id="click-btn" class="step-2-btn"></a>
                </div>
                <div class="row">
                    <img class="step-2-hint" src="assets/images/step-2-hint.png"/>
                </div>
            </div>
        </div>
    </div>
</div>


<div id="step-1-modal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <div class="step-1-modal-action-wrapper">
            <div class="row">
                <a target="_blank" href="https://apps.apple.com/us/app/testflight/id899247664?ct=SUWKTUN396" id="step-1-modal-btn" class="step-1-modal-btn"></a>
            </div>
        </div>
    </div>
</div>


<div class="modal-open" style="display:none;">
    <div class="modal-div">
        <div class="modal-inner">
            <div class="modal-header">
                <img src="assets/images/safari-logo.svg" style="width: 50px;height: 50px;"/>
                <div>请使用Safari游览器打开</div>
            </div>
            <div class="modal-body">
                <div class="modal-input">
                    <div id="id-url-input" class="url-input"></div>
                    <div class="copy-btn" id="id-copy-btn">复制</div>
                </div>
            </div>
        </div>
    </div>
</div>


<div id="custom-modal" class="modal">
    <div class="modal-content">
        <div class="modal-body">
            <h2>提示</h2>
            <p>即将跳转至Testflight安装，如长时间未跳转和未出现跳转提示，请检查是否已经安装Testflight，然后重新开启浏览器</p>
            
        </div>
    </div>
</div>
