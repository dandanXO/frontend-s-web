    async function getApiUrl() {
        try {
            const response = await fetch(`https://ak4wc.ala8tehrnu.com/app/getDownloadPage?siteCode=lh1`);
            const data = await response.json();

            $("#before-load").hide();

    function checkPlatform() {
        var isWeixin = is_weixin();
        if (isWeixin) {
            $(".weixin_tip").show();
            if (/(iPhone|iPad|iPod|iOS)/i.test(navigator.userAgent)) {
                $("#tips").attr("src", "/style/images/wxtips_ios.png");
            } else if (/(Android)/i.test(navigator.userAgent)) {
                $("#tips").attr("src", "/style/images/wxtips_android.png");
            }
        } else {
            $(".download").show();
            if (/(iPhone|iPad|iPod|iOS)/i.test(navigator.userAgent)) {
                // alert('若要安装，请先打开设置-通用-设备管理-东赢体育');
                showIOS();
            } else if (/(Android)/i.test(navigator.userAgent)) {
                showAndroid();
            } else {
                //window.location.href="downloadty_com.html";
                showAndroid();
            }
        }
        console.log(host);
    }

    function is_weixin() {
        var ua = navigator.userAgent.toLowerCase();
        if (ua.match(/MicroMessenger/i) == "micromessenger") {
            return true;
        } else {
            return false;
        }
    }

    function showAndroid() {

` + androidHtml;

`;
