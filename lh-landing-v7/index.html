<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>雷火电竞体育官网</title>

  <link rel="stylesheet" type="text/css" href="css/styles.css" />
  <link rel="icon" href="imgs/favicon.ico" type="image/x-icon" />

  <script type="text/javascript" src="js/jquery-3.6.1.min.js"></script>

  <link rel="stylesheet" href="css/swiper-bundle.min.css" />
  <script src="js/swiper-bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
</head>

<body>
  <div class="main">
    <div class="left">
      <div class="content">
        <img class="logo" src="./imgs/logo.png" alt="">
        <div class="title-div" id="partner">
          <div class="title1">官方合作伙伴</div>
        </div>
        <div class="title-div" id="sponsor">
          <div class="title1">广告赞助球队</div>
        </div>
        <div class="title-div" id="official">
          <div class="title1"><span style="color: #6197F8;">雷火</span>体育官网</div>
          <div class="title2">世界领先的在线博彩品牌</div>
        </div>
        <div class="title-div" id="events">
          <div class="title1">专业<span style="color: #6197F8;">高清</span>赛事</div>
          <div class="title2">立即下注赢不停</div>
        </div>
        <div class="title-div" id="vip">
          <div class="title1">VIP多重<span style="color: #6197F8;">优惠</span></div>
          <div class="title2">专享尊荣待遇</div>
        </div>
        <div class="title-div" id="protection">
          <div class="title1">高规格<span style="color: #6197F8;">防护</span></div>
          <div class="title2">资金安全有保障</div>
        </div>
        <div class="url-box">
          <div id="qrcode"></div>
          <div class="phone-type">
            <div class="apple"><img src="./imgs/iphone_logo.png" alt="">
              <div class="info">
                <div class="title1">iOS</div>
                <div class="title2">iOS 12 或以上</div>
              </div>

            </div>
            <div class="android">
              <img src="./imgs/android_logo.png" alt="">
              <div class="info">
                <div class="title1">Android</div>
                <div class="title2">安卓 7.0 或以上</div>
              </div>
            </div>
          </div>
        </div>

        <div class="enter">进入网页版</div>
      </div>
    </div>

    <div class="right">
      <div class="swiper mySwiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide" data-content="partner"><img src="./imgs/item1.png" alt=""></div>
          <div class="swiper-slide" data-content="sponsor"><img src="./imgs/item2.png" alt=""></div>
          <div class="swiper-slide" data-content="official"><img src="./imgs/item3.png" alt=""></div>
          <div class="swiper-slide" data-content="events"><img src="./imgs/item4.png" alt=""></div>
          <div class="swiper-slide" data-content="vip"><img src="./imgs/item5.png" alt=""></div>
          <div class="swiper-slide" data-content="protection"><img src="./imgs/item6.png" alt=""></div>
        </div>
        <div class="swiper-pagination"></div>
      </div>

    </div>

  </div>
  <div class="h5-main">
    <div class="logo-box">
      <img class="logo" src="./imgs/logo.png" alt="">
    </div>
    <div class="swiper mySwiper2">
      <div class="swiper-wrapper">
        <div class="swiper-slide"><img src="./imgs/item1.png" alt="">
          <div class="title1">官方合作伙伴</div>
          <div class="title2">官方合作伙伴</div>
        </div>
        <div class="swiper-slide"><img src="./imgs/item2.png" alt="">
          <div class="title1">广告赞助球队</div>
          <div class="title2">广告赞助球队</div>
        </div>
        <div class="swiper-slide"><img src="./imgs/item3.png" alt="">
          <div class="title1"><span style="color: #6197F8;">雷火</span>体育官网</div>
          <div class="title2">雷火体育官网</div>
        </div>
        <div class="swiper-slide"><img src="./imgs/item4.png" alt="">
          <div class="title1">专业<span style="color: #6197F8;">高清</span>赛事</div>
          <div class="title2">专业高清赛事</div>
        </div>
        <div class="swiper-slide"><img src="./imgs/item5.png" alt="">
          <div class="title1">VIP多重<span style="color: #6197F8;">优惠</span></div>
          <div class="title2">VIP多重优惠</div>
        </div>
        <div class="swiper-slide"><img src="./imgs/item6.png" alt="">
          <div class="title1">高规格<span style="color: #6197F8;">防护</span></div>
          <div class="title2">高规格防护</div>
        </div>
      </div>
      <div class="swiper-pagination"></div>
    </div>

    <div class="btn-box">
      <div class="enter-app">雷火全站APP</div>
      <div class="enter-url">进入网页版</div>
    </div>

    <div class="up">

      <img src="./imgs/up.png" alt="">
      <div>上滑查看安装教程</div>
    </div>

    <div class="info-div" ontouchmove="myFunction(event)">

      <div class="info-title">安装教学指南<img src="./imgs/close.png" alt="" class="close"></div>
      <img class="info" src="./imgs/info.png" alt="">
    </div>
  </div>


</body>
<script type="text/javascript">


  const swiper = new Swiper('.mySwiper', {
    direction: 'vertical',
    pagination: {
      el: '.swiper-pagination',
      clickable: true,
    },
    on: {
      init: function () {
        const activeSlide = this.slides[this.activeIndex];
        const contentId = activeSlide.getAttribute('data-content');
        showContent(contentId);
      },
      slideChange: function () {
        const activeSlide = this.slides[this.activeIndex];
        const contentId = activeSlide.getAttribute('data-content');
        showContent(contentId);
      }
    }
  });

  const swiper2 = new Swiper('.mySwiper2', {
    pagination: {
      el: '.swiper-pagination',
      clickable: true,
    },
    spaceBetween: 100,
    on: {
      init: function () {
        const activeSlide = this.slides[this.activeIndex];
        const contentId = activeSlide.getAttribute('data-content');
        showContent(contentId);
      },
      slideChange: function () {
        const activeSlide = this.slides[this.activeIndex];
        const contentId = activeSlide.getAttribute('data-content');
        showContent(contentId);
      }
    }
  });

  function showContent(contentId) {
    const titleDivs = document.querySelectorAll('.title-div');
    titleDivs.forEach(div => {
      div.style.display = 'none';
    });

    const divToShow = document.getElementById(contentId);
    if (divToShow) {
      divToShow.style.display = 'block';
    }
  }


  window.addEventListener('resize', function () {
    var screenWidth = window.innerWidth;
    var mainSection = document.querySelector('.main');
    var h5MainSection = document.querySelector('.h5-main');

    if (screenWidth >= 640) {
      mainSection.style.display = 'flex';
      h5MainSection.style.display = 'none';
    } else {
      mainSection.style.display = 'none';
      h5MainSection.style.display = 'block';
    }
  });

  window.dispatchEvent(new Event('resize'));





  function myFunction(event) {
    event.preventDefault();
    const infoDiv = document.querySelector('.info-div');
    infoDiv.style.bottom = '0'; 
  }


  document.addEventListener('touchmove', function (event) {
    const infoDiv = document.querySelector('.info-div');
    infoDiv.style.bottom = '0%';
  });

  document.addEventListener('DOMContentLoaded', function () {
    const closeButton = document.querySelector('.info-div .close');
    const infoDiv = document.querySelector('.info-div');

    closeButton.addEventListener('click', function () {
      infoDiv.style.bottom = '-100%'; 
    });
  });

</script>



</html>
