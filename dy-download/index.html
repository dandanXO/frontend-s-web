<script>
    var andList = [
        {imgurl: './style/images/web/android/01.png'},
        {imgurl: './style/images/web/android/02.png'},
        {imgurl: './style/images/web/android/03.png'},
        {imgurl: './style/images/web/android/04.png'},
        {imgurl: './style/images/web/android/05.png'}
    ];
    var iosList = [
        {imgurl: './style/images/web/ios/ios1.png'},
        {imgurl: './style/images/web/ios/ios2.png'},
        {imgurl: './style/images/web/ios/ios3.png'},
        {imgurl: './style/images/web/ios/ios4.png'},
        {imgurl: './style/images/web/ios/ios5.png'},
        {imgurl: './style/images/web/ios/ios6.png'}
    ];
    $(function () {
        function is_weixin() {
            var ua = navigator.userAgent.toLowerCase();
            if (ua.match(/MicroMessenger/i) == "micromessenger") {
                return true;
            } else {
                return false;
            }
        }

        var isWeixin = is_weixin();
        if (isWeixin) {
            $(".weixin_tip").show();
            if (/(iPhone|iPad|iPod|iOS)/i.test(navigator.userAgent)) {
                $("#tips").attr("src", "/style/images/wxtips_ios.png");
            } else if (/(Android)/i.test(navigator.userAgent)) {
                $("#tips").attr("src", "/style/images/wxtips_android.png");
            }
        } else {
            $(".download").show();
            if (/(iPhone|iPad|iPod|iOS)/i.test(navigator.userAgent)) {
                // alert('若要安装，请先打开设置-通用-设备管理-东赢体育');
                showIOS();
            } else if (/(Android)/i.test(navigator.userAgent)) {
                showAndroid();
            } else {
                //window.location.href="downloadty_com.html";
                showAndroid();
            }
            ;
            var host = window.location.host;
            var vv = {agentCode: getQueryString("agentCode"), regFrom: getQueryString("url"), downloadUrl: host};
            $('#download').attr('data-clipboard-text', "FGH" + JSON.stringify(vv));
            new ClipboardJS('.install');
            $("#download").click(function () {
                var url = $(this).attr("href");
                var type = "ALL_AND";
                if (url.indexOf(".plist") != -1) {
                    type = "ALL_IOS";
                }

                postDownloadExtra(type, host);
            });
        }
        ;
    });

    function showAndroid() {
        for (var i = 0; i < andList.length; i++) {
            $(".swiper-wrapper").append('<div class="swiper-slide"><img src="' + andList[i].imgurl + '" alt=""/></div>')
        }
        ;
        $('#download').attr('href', './dy_app.apk');
    }

    function showIOS() {
        for (var i = 0; i < iosList.length; i++) {
            $(".swiper-wrapper").append('<div class="swiper-slide"><img src="' + iosList[i].imgurl + '" alt=""/></div>')
        }
        ;
        $('#download').attr('href', './dy.mobileconfig');
    }

    var mySwiper = new Swiper('.swiper-container', {
        effect: 'slide',
        pagination: '.swiper-pagination',
        initialSlide: 0,
        observer: true,
        observeParents: true
    });

    function getIosPath() {
        try {
            if (getIsPath()) {
                var path = getTestFlightIosPath();
                $('#download').attr('href', path);
            } else {
                showIOS();
            }
        } catch (err) {
            showIOS();
        }

    };

</script>
