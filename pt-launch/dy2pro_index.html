<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<title>PT游戏大厅</title>
	<script type="text/javascript" src="https://login-ag.nptgp.com/jswrapper/integration.js.php?casino=agdragon"></script>
	<script type="text/javascript">
		var username = getQueryVariable('username');
		var password = getQueryVariable('password');
		var realMode = 1;
		var language = "zh-cn"; //Please refer to Appendix B
		var gamecode = getQueryVariable('gamecode'); //Please refer to google sheet link
		var clientPlatform = getQueryVariable('device'); // web or mobile
		var systemid = "77";
		var casino = "agdragon";

		window.onload=function() {
			if ('true' === 'true') {
				iapiSetCallout('LoginAndGetTempToken', calloutLogin);
				iapiLoginAndGetTempToken(username, password, realMode, language, systemid);
			}
		}

		function getQueryVariable(variable) {
			var query = window.location.search.substring(1);
			var vars = query.split("&");
			for (var i=0;i<vars.length;i++) {
				var pair = vars[i].split("=");
				if(pair[0] == variable){return pair[1];}
			}
			return(false);
		}

		function calloutLogin(response) {
			if (response.errorCode) {
				if (response.errorText !== undefined) {
					alert("[" + response.errorCode + "] " + response.errorText.replace("<br>", "\r\n"));
				}
				else if (response.playerMessage !== undefined) {
					alert("[" + response.errorCode + "] " + response.playerMessage.replace("<br>", "\r\n"));
				}
				else {
					alert("[" + response.errorCode + "] Login Fail.");
				}
			}
			else {
				window.location.href = "https://login-ag.nptgp.com/GameLauncher?gameCodeName=" + gamecode + "&username=" + username
						+ "&tempToken=" + response.sessionToken.sessionToken + "&casino=" + casino + "&clientPlatform=" + clientPlatform + "&language=" + language
						+ "&playMode=" + realMode + "&deposit=" + "&lobby=" + "&swipeOff=true";
			}
		}
	</script>
</head>
</html>
