<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CountDown</title>
    <script src="assets/js/crypto-js.min.js"></script>
</head>
<body id="pak-redirect-v2">

<h1 id="countdown">Redirect in ：5 seconds;</h1>

<script>
    const urlParams = new URLSearchParams(window.location.search);

    // Get the 'id' parameter value
    const item1 = urlParams.get('refer');
    const item2 = urlParams.get('r');
    // console.log(item1)

    let countdownTime = 5;

    const encryptedUrl = "U2FsdGVkX18wf6flDR28GKkf6OFCxydWUzcsLvSxdcqus6anCm3lGfNJ41zRR+lX";
    const secretKey = "Aa123456";  //

    const countdown = setInterval(() => {
        document.getElementById('countdown').innerText = `Redirect in ：${countdownTime} seconds;`
        countdownTime--;

        if (countdownTime < 0) {
            clearInterval(countdown);

            function decryptUrl(encryptedUrl, secretKey) {
                const bytes = CryptoJS.AES.decrypt(encryptedUrl, secretKey);
                return bytes.toString(CryptoJS.enc.Utf8);
            }

            const decryptedUrl = decryptUrl(encryptedUrl, secretKey);
            let afterStr= "";
            if(item1){
                afterStr += `refer/${item1}`
            }else if(item2){
                afterStr += `refer/${item2}`
            }

            if (decryptedUrl) {
                window.location.href = decryptedUrl + afterStr;
            } else {
                document.body.innerHTML = "<h1>Invalid URL</h1>";
            }
        }
    }, 1000);
</script>

</body>
</html>
