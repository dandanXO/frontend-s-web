<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CountDown</title>
    <script src="assets/js/crypto-js.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #1a1a1d;
            color: #f5f5f5;
        }

        .container {
            text-align: center;
            background: #2e2e30;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            color: #e2e2e2;
            margin-bottom: 20px;
        }

        #countdown {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c8761;
        }

        .redirect-info {
            margin-top: 10px;
            font-size: 1rem;
            color: #cccccc;
        }
    </style>
</head>

<body id="pak-redirect-v2">

    <!-- <h1 id="countdown">Waiting time ：5 seconds;</h1> -->
    <div class="container">
        <h1>Redirecting Soon...</h1>
        <h1 id="countdown">Waiting time : 5 seconds;</h1>
        <p class="redirect-info">Please wait while we take you to your destination.</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);

        // Get the 'id' parameter value
        const item1 = urlParams.get('refer');
        const item2 = urlParams.get('r');
        // console.log(item1)

        let countdownTime = 5;

        const encryptedUrl = "U2FsdGVkX18wf6flDR28GKkf6OFCxydWUzcsLvSxdcqus6anCm3lGfNJ41zRR+lX";
        const secretKey = "Aa123456";  //

        const countdown = setInterval(() => {
            document.getElementById('countdown').innerText = `Waiting time : ${countdownTime} seconds;`
            countdownTime--;

            if (countdownTime < 0) {
                clearInterval(countdown);

                function decryptUrl(encryptedUrl, secretKey) {
                    const bytes = CryptoJS.AES.decrypt(encryptedUrl, secretKey);
                    return bytes.toString(CryptoJS.enc.Utf8);
                }

                const decryptedUrl = decryptUrl(encryptedUrl, secretKey);
                let afterStr = "";
                if (item1) {
                    afterStr += `refer/${item1}`
                } else if (item2) {
                    afterStr += `refer/${item2}`
                }

                if (decryptedUrl) {
                    window.location.href = decryptedUrl + afterStr;
                } else {
                    document.body.innerHTML = "<h1>Invalid URL</h1>";
                }
            }
        }, 1000);
    </script>

</body>

</html>
