      <button class="download-btn" id="downloadBtn">Download App</button>

    <script type="text/javascript">
      const searchParams = new URLSearchParams(window.location.search);
      let affidValue = searchParams.get("p0") || searchParams.get("id");
      const campaignname = searchParams.get("p1") || searchParams.get("campaignname");
      const campaignid = searchParams.get("p2") || searchParams.get("campaignid");
      const adsetid = searchParams.get("p3") || searchParams.get("adsetid");
      const adsetname = searchParams.get("p4") || searchParams.get("adsetname");
      const adname = searchParams.get("p5") || searchParams.get("adname");
      const adid = searchParams.get("p6") || searchParams.get("adid");
      const fbclid = searchParams.get("fbclid");
      const fbpid = searchParams.get("fbpid");
      const autoDownload = searchParams.get("autoDownload");

      affidValue = affidValue ?? "A3048D";

      var apiUrl = "";
      var adjustUrlCode = "";
      getApiUrl();

      async function getApiUrl() {
        var button;

        let affiliateLists = {
          A3048D: {
            adCode: "1cjl84xe",
            url: "https://p8s1-ind-files.s3.ap-south-1.amazonaws.com/app/5/affiliate/1796386315862343681/android/apk/1.0.21_20240814145813.apk"
          }
        };

        adjustUrlCode = affiliateLists[affidValue]["adCode"];
        apiUrl = affiliateLists[affidValue]["url"];

        button = document.getElementById("downloadBtn");
        button.onclick = function () {
          downloadApk(code, pp, fbclid, fbpid);
          return false;
        };

        if (autoDownload == "1") {
          downloadApk(code, pp, fbclid, fbpid);
        }
      }

      function getQueryVariable(variable) {
        var query = window.location.search.substring(1);
        var vars = query.split("&");
        for (var i = 0; i < vars.length; i++) {
          var pair = vars[i].split("=");
          if (pair[0] == variable) {
            return pair[1];
          }
        }
        return "";
      }

      var code = getQueryVariable("code");
      var pp = new Array(7);
      for (let i = 0; i < pp.length; i++) {
        pp[i] = getQueryVariable("p" + i);
        pp[i] = pp[i].replace(/{|}/g, "");
      }

      button = document.getElementById("downloadBtn");
      button.onclick = function () {
        downloadApk(code, pp, fbclid, fbpid);
        return false;
      };

      function downloadApk(code, pp, fbvar, fbpid) {
        console.log(apiUrl);
        var date = Date.now();
        var url =
          `https://app.adjust.com/${adjustUrlCode}?campaign=${campaignname}%20%28${campaignid}%29&adgroup=${adsetname}%20%28${adsetid}%29&creative=${adname}%20%28${adid}%29&fbclid=${fbclid}&redirect=${apiUrl}?v=` +
          date;
        // alert(url)
        const link = document.createElement("a");
        link.style.display = "none";
        link.href = url;
        link.download = "ph1-app-1.0.1.apk";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    </script>
