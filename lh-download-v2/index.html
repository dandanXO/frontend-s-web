<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App下载</title>
    <link rel="stylesheet" type="text/css" href="css/download_index.css">
    <link rel="stylesheet" type="text/css" href="css/swiper-3.4.1.min.css">
    <link rel="stylesheet" type="text/css" href="css/index.css">
    <script src="js/jquery-3.2.1.js"></script>
    <script src="js/swiper-3.4.1.min.js"></script>
    <script src="js/clipboard.min.js"></script>
    <style>
        .hidden {
            display: none !important;
        }


    </style>
</head>
<!-- <header class="q-header with-shadow">
    <div class="page-title"
         style="display: flex; align-items: center; position: relative; font-size: 18px; font-weight: bold; padding: 8px 0;">

        <span>APP下载</span>
    </div>
</header> -->
<body>
<div class="main-container">
    <img class="customer_icon" id="dy_customer" src="./images/download_customer.png" />
    <img src="images/logo.png" alt="Logo" style="width:130px;"/>
    <div class="carousel swiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide">

                <div class="custom-slide-content">
                    <div class="flex" style="pointer-events: none;">
                        <img style="width:auto;max-width: 100%;height:45px;" src="./images/title-1.png"/>
                    </div>
                    <div class="flex" style="pointer-events: none;">
                        <img style="width:auto;max-width: 100%;height: 320px;margin-right: 3rem;"
                             src="./images/bg-1.png"/>
                    </div>
                    <div class="flex" style="pointer-events: none;">
                        <img style="width:auto;max-width: 100%;height: 46px;" src="./images/bottom-1.png"/>
                    </div>
                </div>
            </div>
            <div class="swiper-slide">

                <div class="custom-slide-content">
                    <div class="flex" style="pointer-events: none;">
                        <img style="width:auto;max-width: 100%;height:30px;" src="./images/title2-1.png"/>
                    </div>
                    <div class="flex" style="pointer-events: none;">
                        <img style="width:auto;max-width: 100%;height:35px;" src="./images/title2-2.png"/>
                    </div>
                    <div class="flex" style="pointer-events: none;">
                        <img style="width:auto;max-width: 100%;height:240px;" src="./images/bg-2.png"/>
                    </div>
                    <div class="flex" style="pointer-events: none;">
                        <img style="width:auto;max-width: 100%;height:110px;" src="./images/bottom-2.png"/>
                    </div>
                </div>


            </div>
        </div>
        <div class="swiper-pagination"></div>
    </div>
    <button class="btn1" id="openSheetBtn">APP下載</button>
    <button class="btn2 switch-btn">切换安卓</button>
    <button class="btn3" id="openTeachBtn">点击查看安装教程</button>
</div>

<div id="sheetMask" class="sheet-mask hidden"></div>
<div class="bottom-sheet" id="downloadSheet">


    <div class="inner-sheet">
        <img src="./images/ibg-1.png" class="sheet-content-bg"/>
        <div class="sheet-content-1">
            APP下载
        </div>
        <img src="./images/ibg-2.png" class="sheet-content-bg2"/>
        <img src="./images/close.png" class="sheet-content-bg3" id="closeSheetBtn"/>
    </div>
    <div class="sheet-inner-body" style="width: 100%; height: 100%; overflow-y: auto; ">


        <div class="" style="width: 90%; height: 100%; overflow-y: auto; ">
            <div id="android-lists" class="download-lists"></div>
            <div id="ios-lists" class="download-lists"></div>
            <button class="btn1 switch-btn" style="margin-bottom:10px;">切換IOS</button>
        </div>

    </div>
</div>
<div class="bottom-sheet sheet-teach" id="teachSheet">
    <div class="teach1-header-tip">

        <div class="teach1-notch " id="closeTeachBtn"></div>
        <div class="teach1-title">IOS企业应用添加信任</div>
        <p class="teach1-subtitle">安装APP后，请按照以下步骤操作，否则将无法正常运行</p>
    </div>
    <div class="teach1-step-gallery">
        <img style="width:100%;" src="images/teach.png" alt="teach"/>
    </div>
</div>

<div class="modal-open" style="display:none;">
    <div class="modal-div">
        <div class="modal-inner">
            <div class="modal-header">
                <img src="images/safari-logo.svg" style="width: 50px;height: 50px;" />
                <div>
                        <span>该链接只能使用<span class="color-rose">Safari</span>打开<br />请使用<span
                                class="color-rose">Safari</span>游览器打开</span>
                </div>
            </div>
            <div class="modal-body">
                <div class="modal-input">
                    <div id="id-url-input" class="url-input"></div>
                    <div class="copy-btn" id="id-copy-btn">复制</div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>

    var iosDownload = []
    var androidDownload = []

    var realUrl = getQueryString('url')
    var agentCode = getQueryString('agentCode')
    var from = getQueryString('from')
    if (agentCode === null || agentCode === 'null') {
        agentCode = ''
    }
    if (realUrl === null || realUrl === 'null') {
        realUrl = ''
    }
    if (agentCode === null || agentCode === 'null') {
        agentCode = ''
    }

    var host = window.location.host
    var vv = { agentCode: agentCode, regFrom: realUrl, downloadUrl: host }
    // console.log(vv);

    const apiUrl = 'https://apti7i0607tl.hz3wk041.com'
    const dataUrl = 'https://tfwkgol.076knee9cc.com'
    var liveUrl1 = "";
    var liveUrl2 = "";


    let currentPlatform = ''

    getApiUrl()
    getCustomerUrl();

    var type = 'ALL_AND'

    $('#dy_customer').click(() => {
        window.open(liveUrl1)
    })

    $('.switch-btn').click(function () {
        if (currentPlatform === 'ios') {
            showAndroid()
        } else {
            showIOS()
        }
    })

    $('.modal-div').click(function (e) {
        $('.modal-open').hide()
    })

    $('.modal-inner').click(function (e) {
        e.stopPropagation()
    })


    async function getApiUrl() {
        try {
            // const response = await fetch(apiUrl + `/app/download/affiliate/url?siteCode=LH1&affiliateCode=${agentCode}`);
            const response = await fetch(dataUrl + `/getDownData`)
            const data = await response.json()
            let subTitle = ['高效 快捷', ' 防失联 不掉签', '长期 稳定']

            $('#before-load').hide()
            if (data) {
                // console.log("data", data);
                iosDownload = (data.data.ios).map(item => {
                    const [name, url] = Object.entries(item)[0]
                    return {
                        name,
                        url,
                        subtitle: subTitle[Math.floor(Math.random() * subTitle.length)],
                        isDownload: false
                    }
                })
                androidDownload = data.data.android.map(item => {
                    const [name, url] = Object.entries(item)[0]
                    return {
                        name,
                        url,
                        subtitle: subTitle[Math.floor(Math.random() * subTitle.length)],
                        isDownload: false
                    }
                })
                console.log(iosDownload)
                console.log(androidDownload)

                checkPlatform()
            }
            setTimeout(() => {
                if (iosDownload.length === 0 && androidDownload.length === 0) {
                    $('#before-load').text('加载失败，请重连页面')
                }
            }, 5000)
        } catch (error) {
            console.error('Error fetching slide data:', error)
        }
    }
    async function getCustomerUrl() {
        try {
            const response = await fetch(dataUrl + `/getCustomerService`);
            const data = await response.json();
            if (data && data.code === 0) {
                liveUrl1 = data.data.liveUrl1;
                liveUrl2 = data.data.liveUrl2;
            }

        } catch (error) {
            console.log(error)
        }
    }

    function checkPlatform() {
        var isWeixin = is_weixin()
        if (isWeixin) {
            $('.weixin_tip').show()
            if (/(iPhone|iPad|iPod|iOS)/i.test(navigator.userAgent)) {
                $('#tips').attr('src', '/style/images/wxtips_ios.png')
            } else if (/(Android)/i.test(navigator.userAgent)) {
                $('#tips').attr('src', '/style/images/wxtips_android.png')
            }
        } else {
            $('.download').show()
            if (/(iPhone|iPad|iPod|iOS)/i.test(navigator.userAgent)) {
                showIOS()
            } else if (/(Android)/i.test(navigator.userAgent)) {
                showAndroid()
            } else {
                //window.location.href="downloadty_com.html";
                showAndroid()
            }
        }
        console.log(host)
    }

    function is_weixin() {
        var ua = navigator.userAgent.toLowerCase()
        if (ua.match(/MicroMessenger/i) == 'micromessenger') {
            return true
        } else {
            return false
        }
    }


    function showAndroid() {
        currentPlatform = 'android'
        $('.switch-btn').html('切换 IOS')
        $('#android-lists').removeClass('hidden')
        $('#ios-lists').addClass('hidden')

        var androidHtml = ''
        androidDownload.forEach((item, index) => {
            androidHtml += `
        <div class="sub1-download-card" data-url="${item.url}" id="download_and_${index}">
            <img src="images/icon-super.png" alt="super version" class="sub1-icon" />
            <div class="sub1-content">
                <div class="sub1-title">${item.name || ''}</div>
                <div class="sub1-subtitle">${item.subtitle || ''}</div>
            </div>
            <button class="sub1-btn-download ${item.isDownload ? 'sub1-inactive' : 'sub1-active'}" id="download_${index}"
                data-clipboard-text='UIO${JSON.stringify(vv)}'
                ${item.isDownload ? 'disabled' : ''}>
                ${item.isDownload ? '已下载' : '下载'}
            </button>
        </div>
        `
        })
        $('#android-lists').html(androidHtml)

        androidDownload.forEach((list, index) => {
            $(`#download_${index}`).attr('data-clipboard-text', "UIO" + JSON.stringify(vv));

            new ClipboardJS(`#download_${index}`)

            $(`#download_and_${index} .sub1-btn-download`).on('click', function () {
                if (!list.isDownload) {
                    downloadFile(list.url, list.name, index)
                    list.isDownload = true
                    $(this)
                        .addClass('sub1-inactive')
                        .removeClass('sub1-active')
                        .attr('disabled', true)
                        .text('已下载')

                    postDownloadExtra(type, host);
                }
            })

        })

    }

    function detectIfSafari() {
        // console.log(navigator.userAgent)
        if (isSafari()) {
            // Safari detected
            console.log('You are using Safari.')
        } else {
            // Not Safari
            console.log('You are not using Safari.')
            $('#id-url-input').text(window.location.href)

            $('.modal-open').show()


            $('#id-copy-btn').click(function (e) {
                var textToCopy = $('#id-url-input').text()

                copyTextToClipboard(textToCopy)
                alert('复制成功。')
            })
        }
    }

    function isSafari() {
        return /^((?!chrome|android).)*safari/i.test(navigator.userAgent)
    }

    function copyTextToClipboard(text) {
        var textarea = document.createElement('textarea')
        textarea.value = text
        document.body.appendChild(textarea)
        textarea.select()
        document.execCommand('copy')
        document.body.removeChild(textarea)
    }


    function showIOS() {
        currentPlatform = 'ios'
        $('.switch-btn').html('切换安卓')
        $('#android-lists').addClass('hidden')
        $('#ios-lists').removeClass('hidden')


        detectIfSafari()

        $('#desc').removeClass('hidden')

        var iosHtml = ''
        iosDownload.forEach((item, index) => {
            iosHtml += `
        <div class="sub1-download-card" data-url="${item.url}" id="download_ios_${index}">
            <img src="images/icon-super.png" alt="super version" class="sub1-icon" />
            <div class="sub1-content">
                <div class="sub1-title">${item.name || ''}</div>
                <div class="sub1-subtitle">${item.subtitle || ''}</div>
            </div>
            <button class="sub1-btn-download ${item.isDownload ? 'sub1-inactive' : 'sub1-active'}" id="download_${index}"
                data-clipboard-text='UIO${JSON.stringify(vv)}'
                ${item.isDownload ? 'disabled' : ''}>
                ${item.isDownload ? '已下载' : '下载'}
            </button>
        </div>
        `
        })
        $('#ios-lists').html(iosHtml)

        iosDownload.forEach((list, index) => {
            $(`#download_${index}`).attr('data-clipboard-text', "UIO" + JSON.stringify(vv));

            new ClipboardJS(`#download_${index}`);

            $(`#download_ios_${index} .sub1-btn-download`).on('click', function () {
                if (!list.isDownload) {
                    downloadFile(list.url, list.name, index)
                    list.isDownload = true
                    $(this)
                        .addClass('sub1-inactive')
                        .removeClass('sub1-active')
                        .attr('disabled', true)
                        .text('已下载')

                    postDownloadExtra(type, host);
                }
            })
        })

        // $(`#download_kuaijie`).attr('data-clipboard-text', "UIO" + JSON.stringify(vv));
        // new ClipboardJS(`#download_kuaijie`);
        // $(`#download_kuaijie`).click(function () {
        //     postDownloadExtra(type, host);
        // });
    }


    function getQueryString(name) {
        var reg = new RegExp('(^|&)' + name + '=([^&]*)(&|$)')
        var r = window.location.search.substr(1).match(reg)
        if (r != null) return unescape(r[2])
        return null
    }


    function postDownloadExtra() {
        $.ajax({
            url: dataUrl + "/extra",
            type: "GET",
            data: { "agentCode": agentCode, siteCode: "lh1" },
            success: function (d) { }
        });
    }

    function downloadFile(url, fileName, index) {
        const link = document.createElement('a')
        link.href = url
        link.download = fileName || ''
        link.target = '_blank'
        document.body.appendChild(link)
        link.click()
        document.body.removeChild(link)

        // Use plain variables/arrays
        const list =  currentPlatform = 'android' ? androidDownload : iosDownload
        if (list[index]) {
            console.log('list[index]', list[index])
            list[index].isDownload = true
        }
    }

    const swiper = new Swiper('.swiper', {
        loop: true, autoplay: 5000, speed: 500, pagination: '.swiper-pagination', paginationClickable: true
    })

    $(function () {
        $('#openSheetBtn').on('click', function () {
            showSheet($('#downloadSheet'))
        })
        $('#closeSheetBtn').on('click', function () {
            hideSheet($('#downloadSheet'))
        })
        $('#openTeachBtn').on('click', function () {
            showSheet($('#teachSheet'))
        })
        $('#closeTeachBtn').on('click', function () {
            hideSheet($('#teachSheet'))
        })
        $('#downloadSheet, #teachSheet').on('animationend transitionend', function () {
            if ($(this).hasClass('hiding')) {
                $(this).removeClass('hiding active').css('display', 'none')
            }
        })
    })


    function showSheet($sheet) {
        $('#sheetMask').removeClass('hidden');
        $sheet.removeClass('hiding').addClass('active').css('display', 'flex')
    }

    function hideSheet($sheet) {
        $('#sheetMask').addClass('hidden');
        $sheet.removeClass('active').addClass('hiding')
    }
    // 點擊 mask 關閉 downloadSheet
    $('#sheetMask').on('click', function () {
        hideSheet($('#downloadSheet'));
        hideSheet($('#teachSheet'));
    });

</script>
</body>
</html>
