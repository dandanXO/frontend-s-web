<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
  $(document).ready(function () {
    const webLinks = [
      "lh952.cc",
      "lh722.cc",
      "lh180.cc",
      "lh672.cc",
      "lh332.cc",
      "lh919.cc"
    ];

    const mobileLinks = [
      "m.lh952.cc",
      "m.lh722.cc",
      "m.lh180.cc",
      "m.lh672.cc",
      "m.lh332.cc",
      "m.lh919.cc"
    ];

    const createSlides = (links) => {
      const slidesContainer = document.querySelector(".carousel-inner");
      let slideGroup = [];

      links.forEach((link, index) => {
        const div = document.createElement("div");
        div.className = "slide-box";
        div.innerHTML = `
            <h4>雷火${index + 1}站</h4>
            <div class="arrow"><img src="imgs/rgtarrow.png"></div>
            <div class="boxlink">
            <div class="box">https://${link}</div>
            <a href="https://${link}" target="_blank">进入雷火</a>
            </div>
          `;
        slideGroup.push(div.outerHTML);

        if ((index + 1) % 5 === 0 || index === links.length - 1) {
          const slideDiv = document.createElement("div");
          slideDiv.className = `item ${slidesContainer.children.length === 0 ? "active" : ""}`;
          slideDiv.innerHTML = `<div class="slide-content">${slideGroup.join("")}</div>`;
          slidesContainer.appendChild(slideDiv);
          slideGroup = [];
        }
      });
    };

    const isMobile = window.innerWidth < 768;
    createSlides(isMobile ? mobileLinks : webLinks);

    $("#myCarousel").carousel();
  });
  // Function to generate a QR code
  function generateQRCode(link) {
    const container = document.getElementById("qr-container");
    container.innerHTML = ""; // Clear the container
    QRCode.toDataURL(link, { width: '100%', margin: 2 }, (err, url) => {
      if (err) {
        console.error("Error generating QR code:", err);
        return;
      }
      const img = document.createElement("img");
      img.src = url;
      container.appendChild(img);
    });
  }

  // Example usage
  const link = "https://lhd328.app/?agentCode=0A7E4D"; // Replace with your desired link
  generateQRCode(link);
</script>
