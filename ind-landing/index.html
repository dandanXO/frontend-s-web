<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>雷火电竞体育官网</title>

    <link rel="stylesheet" type="text/css" href="css/styles.css" />
  </head>
  <body>
    <div class="showMobile">
      <div class="main-wrapper">
        <img style="margin:0 auto;width:30%;padding:0 2%;" class="logo" src="img/55ace-logo.svg" />
        <img style="width:90%;margin:0 auto;" src="img/title.svg" />
        <img src="img/main-img.png" />
        <div style="width:90%;margin:0 auto;">
          <a href="https://www.google.com" target="_blank">
            <div class="dl-app-btn"></div>
          </a>
        </div>
        <div style="width:90%;margin:0 auto;">
          <a href="https://www.55ace.com" target="_blank">
            <div class="website-btn"></div>
          </a>
        </div>
        <img style="width:70%;margin:0 auto;" src="img/caption.svg" />
      </div>
    </div>
    <div class="showDesktop">
      <div class="main-wrapper"> 
        <div class="left">
            <img style="width:40%;" class="logo" src="img/55ace-logo.svg" />
            <img style="width:80%;" src="img/title.svg" />
            <div class="qr-code-section">
              <img class="app-dl-qr" src="./img/55ace-qr-code.jpg" />
              <img class="website-qr" src="./img/55ace-qr-code.jpg" />
            </div>
          </div>
          <div class="right">
          <img src="img/main-img.png" />
        </div>
      </div>
    </div>
  </body>
</html>
