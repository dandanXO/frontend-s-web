  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const overlay = document.querySelector(".overlay");
      const closeOverlay = document.querySelector(".close-overlay");
      const popButtons = document.querySelectorAll(".pop-btn");
      const overlayContents = document.querySelectorAll(".overlay-content > div");

      const scrolLDown = document.getElementById("scrolldown-tbn");

      scrolLDown.addEventListener("click", function (e) {
        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: 'smooth' // This makes the scroll smooth
        });
      })

      popButtons.forEach((button) => {
        button.addEventListener("click", function () {
          const attr = button.getAttribute("attr");
          overlayContents.forEach((content) => {
            if (content.classList.contains(`pop-overlay-${attr.slice(-1)}`)) {
              content.classList.remove("hidden");
            } else {
              content.classList.add("hidden");
            }
          });
          overlay.style.display = "block";
        });
      });

      closeOverlay.addEventListener("click", function () {
        overlay.style.display = "none";
      });

      overlay.addEventListener("click", function (event) {
        if (event.target === overlay) {
          overlay.style.display = "none";
        }
      });
    });
