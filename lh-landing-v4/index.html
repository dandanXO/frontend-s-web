<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>雷火电竞体育官网</title>

  <link rel="stylesheet" type="text/css" href="css/styles.css" />
  <link rel="icon" href="imgs/favicon.ico" type="image/x-icon" />

  <script type="text/javascript" src="js/jquery-3.6.1.min.js"></script>
</head>
<body>
<div class="main-wrapper">
  <div class="full-container">
    <div class="top-wrapper">
      <div class="top-logo">
        <img src="imgs/lh-logo2.png" alt="雷火 TFGAMING" title="雷火 TFGAMING" />
      </div>
      <div class="top-cs">
        <a href="https://csweb.mh98q4u1yq.com/?partnerCode=LHCS&way=WEB&lang=zh-CN" target="_blank"><img src="imgs/cs-contact-btn.png" alt="" /></a>
      </div>
    </div>
    <div class="pop-btns-wrapper">
      <div class="pop-btns-container">
        <div class="pop-btns-item pop-btn" attr="pop-1">
          <div class="item-icon"><img src="imgs/pop-icon-01.png" /></div>
          <div class="item-details">
            <div class="details-title"><img src="imgs/pop-icon-01-title.png" /></div>
            <div class="details-desc"><img src="imgs/pop-icon-01-desc.png" /></div>
          </div>
          <div class="item-arrow"><img src="imgs/pop-arrow.png" class="swing" /></div>
        </div>

        <div class="pop-btns-item pop-btn" attr="pop-2">
          <div class="item-icon"><img src="imgs/pop-icon-02.png" /></div>
          <div class="item-details">
            <div class="details-title"><img src="imgs/pop-icon-02-title.png" /></div>
            <div class="details-desc"><img src="imgs/pop-icon-02-desc.png" /></div>
          </div>
          <div class="item-arrow"><img src="imgs/pop-arrow.png" class="swing" /></div>
        </div>

        <div class="pop-btns-item pop-btn" attr="pop-3">
          <div class="item-icon"><img src="imgs/pop-icon-03.png" /></div>
          <div class="item-details">
            <div class="details-title"><img src="imgs/pop-icon-03-title.png" /></div>
            <div class="details-desc"><img src="imgs/pop-icon-03-desc.png" /></div>
          </div>
          <div class="item-arrow"><img src="imgs/pop-arrow.png" class="swing" /></div>
        </div>

        <div class="pop-btns-item pop-btn" attr="pop-4">
          <div class="item-icon"><img src="imgs/pop-icon-04.png" /></div>
          <div class="item-details">
            <div class="details-title"><img src="imgs/pop-icon-04-title.png" /></div>
            <div class="details-desc"><img src="imgs/pop-icon-04-desc.png" /></div>
          </div>
          <div class="item-arrow"><img src="imgs/pop-arrow.png" class="swing" /></div>
        </div>
      </div>
    </div>
  </div>
  <div class="sub-title-img">
    <img src="imgs/subtitle-contact.png" />
  </div>

  <div class="contact-btns-wrapper">
    <div class="contact-btns-container">
      <div class="contact-btn w-50"><img src="imgs/contact-btn-01.png" /></div>
      <div class="contact-btn w-50"><img src="imgs/contact-btn-02.png" /></div>
      <div class="contact-btn w-100"><a href="https://vo28.cc" target="_blank"><img src="imgs/contact-btn-03.png" /></a></div>
      <div class="contact-btn w-50"><img src="imgs/contact-btn-04.png" /></div>
      <div class="contact-btn w-50"><img src="imgs/contact-btn-05.png" /></div>
    </div>
  </div>

  <div class="main-sticky-btn" id="scrolldown-tbn">申请联系方式</div>
</div>

<div class="overlay">
  <div class="overlay-content">
    <div class="pop-overlay-1 hidden">
      <img src="imgs/pop-overlay-01.png" />
      <div class="pop-overlay-btns">
        <a href="https://csweb.mh98q4u1yq.com/?partnerCode=LHCS&way=WEB&lang=zh-CN" target="_blank"><img src="imgs/pop-overlay-btn-01.png" /></a>
        <a href="https://www.lh09903.com/" target="_blank" style="margin-top: 5px"><img src="imgs/pop-overlay-btn-02.png" /></a>
      </div>
    </div>
    <div class="pop-overlay-2 hidden">
      <img src="imgs/pop-overlay-02.png" />
      <div class="pop-overlay-btns">
        <a href="https://csweb.mh98q4u1yq.com/?partnerCode=LHCS&way=WEB&lang=zh-CN" target="_blank"><img src="imgs/pop-overlay-btn-01.png" /></a>
        <a href="https://www.lh09903.com/" target="_blank" style="margin-top: 5px"><img src="imgs/pop-overlay-btn-02.png" /></a>
      </div>
    </div>
    <div class="pop-overlay-3 hidden">
      <img src="imgs/pop-overlay-03-1.png" />
      <div class="pop-overlay-btns">
        <a href="https://csweb.mh98q4u1yq.com/?partnerCode=LHCS&way=WEB&lang=zh-CN" target="_blank"><img src="imgs/pop-overlay-btn-01.png" /></a>
        <a href="https://www.lh09903.com/" target="_blank" style="margin-top: 5px"><img src="imgs/pop-overlay-btn-02.png" /></a>
      </div>
    </div>
    <div class="pop-overlay-4 hidden">
      <img src="imgs/pop-overlay-04.png" />
      <div class="pop-overlay-btns">
        <a href="https://csweb.mh98q4u1yq.com/?partnerCode=LHCS&way=WEB&lang=zh-CN" target="_blank"><img src="imgs/pop-overlay-btn-01.png" /></a>
        <a href="https://www.lh09903.com/" target="_blank" style="margin-top: 5px"><img src="imgs/pop-overlay-btn-02.png" /></a>
      </div>
    </div>
    <span class="close-overlay"><img src="imgs/overlay-close.png" /></span>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const overlay = document.querySelector(".overlay");
    const closeOverlay = document.querySelector(".close-overlay");
    const popButtons = document.querySelectorAll(".pop-btn");
    const overlayContents = document.querySelectorAll(".overlay-content > div");

    const scrolLDown= document.getElementById("scrolldown-tbn");

    scrolLDown.addEventListener("click", function(e){
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: 'smooth' // This makes the scroll smooth
      });
    })

    popButtons.forEach((button) => {
      button.addEventListener("click", function () {
        const attr = button.getAttribute("attr");
        overlayContents.forEach((content) => {
          if (content.classList.contains(`pop-overlay-${attr.slice(-1)}`)) {
            content.classList.remove("hidden");
          } else {
            content.classList.add("hidden");
          }
        });
        overlay.style.display = "block";
      });
    });

    closeOverlay.addEventListener("click", function () {
      overlay.style.display = "none";
    });

    overlay.addEventListener("click", function (event) {
      if (event.target === overlay) {
        overlay.style.display = "none";
      }
    });
  });
</script>
</body>
</html>
