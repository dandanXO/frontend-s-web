<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <link rel="stylesheet" type="text/css" href="css/styles.css" />

  <body>
    <div class="showMobile">

        <img style="margin:0 auto;width:30%;padding:0 2%;" class="logo" src="img/indwin7-logo.svg" />
        <img style="width:90%;margin:0 auto;" src="img/title.svg" />
        <img src="img/main-img.png" />
        <div style="width:90%;margin:0 auto;">

        </div>
        <div style="width:90%;margin:0 auto;">

    <div class="showDesktop">

          <img style="width:80%;" src="img/title.svg" />

        var appDlQR = new QRCode("app-dl-qr");
        var websiteQR = new QRCode("website-qr");

        appDlQR.makeCode('https://p8s1-ind-files.s3.ap-south-1.amazonaws.com/app/9/affiliate/1776144113453735937/android/apk/1.0.26_20240828162813.apk');
        websiteQR.makeCode('https://www.indwin7.com');
      })();
    </script>

</html>
