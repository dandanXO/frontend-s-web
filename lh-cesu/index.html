  <script type="text/javascript">
    var hostname = window.location.hostname;
    if (hostname.indexOf("leihuo18.com") > -1) {
      LA.init({ id: "Kc6f6WLCDzDCVCol", ck: "Kc6f6WLCDzDCVCol" });
    } else if (hostname.indexOf("leihuo16.com") > -1) {

    }

    (function () {

    })();

    function renderBasedOnScreenSize() {
      const mobileScreenDiv = document.getElementById("mobileScreenDiv");
      const largeScreenDiv = document.getElementById("largeScreenDiv");

      if (window.innerWidth >= 768) {
        mobileScreenDiv.style.display = "none";
        largeScreenDiv.style.display = "grid";
      } else {
        mobileScreenDiv.style.display = "flex";
        largeScreenDiv.style.display = "none";
      }
    }

    renderBasedOnScreenSize();

    window.addEventListener("resize", renderBasedOnScreenSize);
  </script>
