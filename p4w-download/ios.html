<script>
    var versionNo = "1.0.18";

    var andList = [
        {imgurl: '/styles/images/android/1.png'},
        {imgurl: '/styles/images/android/2.png'},
        {imgurl: '/styles/images/android/3.png'},
        {imgurl: '/styles/images/android/4.png'},
        {imgurl: '/styles/images/android/5.png'}
    ];
    var iosList = [
        {imgurl: '/styles/images/ios/ios1.png'},
        {imgurl: '/styles/images/ios/ios2.png'},
        {imgurl: '/styles/images/ios/ios3.png'},
        {imgurl: '/styles/images/ios/ios4.png'},
        {imgurl: '/styles/images/ios/ios5.png'},
        {imgurl: '/styles/images/ios/ios6.png'}
    ];
    $(function () {

        // if (location.href.indexOf("p4w008.cc") > -1 || originValue.indexOf('p4w008.cc') > -1){
        //     //Put FB Pixel.
        //     fbq("init", "1561523747723504");
        //     fbq("track", "PageView");
        // }


        function is_weixin() {
            var ua = navigator.userAgent.toLowerCase();
            if (ua.match(/MicroMessenger/i) == "micromessenger") {
                return true;
            } else {
                return false;
            }
        }

        var isWeixin = is_weixin();
        if (isWeixin) {
            $(".weixin_tip").show();
            if (/(iPhone|iPad|iPod|iOS)/i.test(navigator.userAgent)) {
                $("#tips").attr("src", "/style/images/wxtips_ios.png");
            } else if (/(Android)/i.test(navigator.userAgent)) {
                $("#tips").attr("src", "/style/images/wxtips_android.png");
            }
        } else {
            $(".download").show();
            if (/(iPhone|iPad|iPod|iOS)/i.test(navigator.userAgent)) {
                getIosPath();
            } else if (/(Android)/i.test(navigator.userAgent)) {
                showAndroid();
            } else {
                // window.location.href="downloadty_com.html";
                showAndroid();
            }
        }


        $("#verNo").html("(" + versionNo + ")");
        var host = window.location.host;
        $("#download").click(function () {
            var url = $(this).attr("href");
            var type = "ALL_AND";
            if (url.indexOf(".plist") != -1) {
                type = "ALL_IOS";
            }
        });
        $("#download2").click(function () {
            var url = $(this).attr("href");
            var type = "ALL_AND";
            if (url.indexOf(".plist") != -1) {
                type = "ALL_IOS";
            }
        });
        new ClipboardJS('.install');
        new ClipboardJS('.install--2');
    });

    function showIOS() {
        for (var i = 0; i < iosList.length; i++) {
            $(".swiper-wrapper").append('<div class="swiper-slide"><img src="' + iosList[i].imgurl + '" alt=""/></div>')
        }
        ;
        $('#download').attr('href', 'https://file.l6ycthbugz.com/apps/p4win.mobileconfig');
        $('#download2').css('display', 'none');
    }

    function showAndroid() {
        for (var i = 0; i < andList.length; i++) {
            $(".swiper-wrapper").append('<div class="swiper-slide"><img src="' + andList[i].imgurl + '" alt=""/></div>')
        }
        ;
        //$('#download').attr('href', 'http://sfxxfq.qcdmhii.com/xf?v=' + Date.now());
        $('#download').attr('href', 'https://file.l6ycthbugz.com/apps/p4w-app-1.0.15.apk');
        $('#download2').attr('href', 'https://file.l6ycthbugz.com/apps/p4w-app-1.0.15.apk');
    }

    var mySwiper = new Swiper('.swiper-container', {
        effect: 'slide',
        pagination: '.swiper-pagination',
        initialSlide: 0,
        observer: true,
        observeParents: true
    });

    function getIosPath() {
        try {
            if (getIsPath()) {
                var path = getTestFlightIosPath();
                $('#download').attr('href', path);
                $('#download2').attr('href', path);
            } else {
                showIOS();
            }
        } catch (err) {
            showIOS();
        }
    };
</script>
