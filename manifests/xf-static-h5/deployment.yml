apiVersion: apps/v1
kind: Deployment
metadata:
  name: xf-static-h5
  namespace: xinfa
  labels:
    app: xf-static-h5
    tier: frontend
spec:
  selector:
    matchLabels:
      app: xf-static-h5
      tier: frontend
  template:
    metadata:
      labels:
        app: xf-static-h5
        tier: frontend
    spec:
      containers:
        - name: xf-static-h5
          image: git.caspen-tech.com:5050/jolly88-complex/frontend:xf-static-h5-972dd2c4 # {"$imagepolicy": "xinfa:xf-static-h5"}
          ports:
            - containerPort: 80
          env:
            - name: TZ
              value: Asia/Singapore
          imagePullPolicy: Always
          resources:
            requests:
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - xf-static-h5
              topologyKey: kubernetes.io/hostname
      imagePullSecrets:
        - name: gitlab-registry
