apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dy-static-web
  namespace: xinfa
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
spec:
  tls:
    - hosts:
        - dy-web.jolly88-ph01.com
      secretName: dy-static-web
  rules:
  - host: dy-web.jolly88-ph01.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dy-static-web
            port:
              number: 80
