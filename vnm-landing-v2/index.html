<script>
  document.addEventListener("DOMContentLoaded", function () {
    const overlay = document.querySelector(".overlay");
    const closeOverlay = document.querySelector(".close-overlay");
    const popButtons = document.querySelectorAll(".pop-btn");
    const overlayContents = document.querySelectorAll(".overlay-content > div");

    const scrolLDown = document.getElementById("scrolldown-tbn");

    scrolLDown.addEventListener("click", function (e) {
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth" // This makes the scroll smooth
      });
    });

    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect');

    const host= window.location.hostname;
    var tf88Url= "https://6789tf.com"
    if(redirectUrl){
      tf88Url= "https://t667788.com"
    }else if(host.includes("z888686")){
      tf88Url= "https://tf88568.com";
    }

    var elements = document.getElementsByClassName('hyperlink');
    for (var i = 0; i < elements.length; i++) {
      elements[i].href = tf88Url + "/register";
    }


    popButtons.forEach((button) => {
      button.addEventListener("click", function () {
        const attr = button.getAttribute("attr");
        overlayContents.forEach((content) => {
          if (content.classList.contains(`pop-overlay-${attr.slice(-1)}`)) {
            content.classList.remove("hidden");
          } else {
            content.classList.add("hidden");
          }
        });
        overlay.style.display = "block";
      });
    });

    // closeOverlay.addEventListener("click", function () {
    //   overlay.style.display = "none";
    // });

    // overlay.addEventListener("click", function (event) {
    //   if (event.target === overlay) {
    //     overlay.style.display = "none";
    //   }
    // });


    const images = ["img/banner1.png", "img/banner2.png","img/banner3.png","img/banner4.png","img/banner5.png","img/banner6.png","img/banner7.png"];
    let currentIndex = 0;
    const imgElement = document.getElementById('banner-img');

    function changeImage() {
      imgElement.classList.add('fade-out');
      setTimeout(() => {
        currentIndex = (currentIndex + 1) % images.length;
        imgElement.src = images[currentIndex];
        imgElement.classList.remove('fade-out');
      }, 1000); // 1 second duration for fade out
    }

    setInterval(changeImage, 3000);
  });
</script>
