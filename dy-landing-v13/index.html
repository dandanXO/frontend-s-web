        <div class="contact-wrapper">

              <div class="contact-item w-50" style="height: 100%">

                </div>

              </div>

            <div class="contact-item w-100">
              <div class="contact-group">
                <div class="icon">
                  <img src="./imgs/service-icon.png" alt="" />

                  <span id="agent1-id">VIP859</span>
                </div>
              </div>
              <a href="https://am787.cc" id="landing-page-link3" target="_blank" class="service-icon">
                <img src="./imgs/contact-btn.png" alt="" />
              </a>
            </div>
            <div class="contact-item w-100">
              <div class="contact-group">
                <div class="icon">
                  <img src="./imgs/service-icon.png" alt="" />
                </div>
                <div style="display: flex; flex-direction: column">
                  <span class="title">Amico 专员 ID</span>
                  <span id="agent2-id">VIP859</span>
                </div>
              </div>
              <a href="https://www.am787.cc" id="landing-page-link1" target="_blank" class="service-icon">
                <img src="./imgs/contact-btn.png" alt="" />
              </a>
            </div>

            <a href="https://www.am787.cc" id="landing-page-link2" target="_blank" style="width: 100%">
              <img src="./imgs/contact-download.png" width="100%" />
            </a>
          </div>
        </div>
      </div>
    </div>

    <script type="text/javascript">
      document.addEventListener("DOMContentLoaded", function () {
        const contactBtn = document.getElementById("contact-btn");
        const fullWindow = document.querySelector(".full-container");

        contactBtn.addEventListener("click", () => {
          fullWindow.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
          });
        });
      });

      function updateContactInfoByHostname() {
        const hostname = window.location.host.replace("www.", "");
        // console.log(hostname, "dan");

        const contactInfo = {};

        // Default content if no hostname matches
        const defaultInfo = {
          group1Title: "大发特发：",
          group1Number: "1002516732",
          group2Title: "福满多： ",
          group2Number: "558193077",
          landingPageLink: "https://am787.cc", // You can set a default link or leave it empty
          redirectUrl: "https://www.dy78313.com",
          claimUrl: "https://www.dy78313.com",
          agent1ID: "vip121",
          agent2ID: "vip521"
        };

        const selectedInfo = contactInfo[hostname] || defaultInfo;
        console.log("ENd Info");
        console.log(selectedInfo);

        document.getElementById("group1-title").textContent = selectedInfo.group1Title;
        document.getElementById("group1-number").textContent = selectedInfo.group1Number;
        document.getElementById("group2-title").textContent = selectedInfo.group2Title;
        document.getElementById("group2-number").textContent = selectedInfo.group2Number;
        document.getElementById("group3-title").textContent = selectedInfo.group3Title;
        document.getElementById("group3-number").textContent = selectedInfo.group3Number;
        document.getElementById("landing-page-link1").href = selectedInfo.landingPageLink;
        document.getElementById("landing-page-link2").href = selectedInfo.landingPageLink;
        document.getElementById("landing-page-link3").href = selectedInfo.landingPageLink;
        document.getElementById("agent1-id").textContent = selectedInfo.agent1ID;
        document.getElementById("agent2-id").textContent = selectedInfo.agent2ID;
        document.getElementById("agent3-id").textContent = selectedInfo.agent3ID;
        const contactItem = document.querySelector(".contact-item3");
        const contactItemAgent = document.querySelector(".contact-item3agent");

        if (!selectedInfo.group3Title || !selectedInfo.agent3ID) {
          contactItem.style.display = "none";
          contactItemAgent.style.display = "none";
        }
        var element = document.getElementById("tf88Url-btn");
        var claimBtnElement = document.getElementById("click-to-claim-btn");

        if (element) {
          element.href = selectedInfo.redirectUrl;
        }
        if (claimBtnElement) {
          claimBtnElement.href = selectedInfo.claimUrl;
        }
      }

      // Call the function to update content based on the current hostname
      updateContactInfoByHostname();
    </script>

    <script charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js"></script>
