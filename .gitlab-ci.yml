#    - if [ "$CI_COMMIT_BRANCH" == "staging" ]; then npm run build:staging; elif [ "$CI_COMMIT_BRANCH" == "test" ]; then npm run build:test; else npm run build:prod; fi

#.build-web:
#  script:
#    - cd $PROJECT
#    - npm install
#    - if [ "$CI_COMMIT_BRANCH" == "staging" ]; then npm run build:staging; elif [ "$CI_COMMIT_BRANCH" == "test" ]; then npm run build:test; else npm run build:prod; fi

.sonarqube-check:
  stage: code-check-and-build
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  script: 
    - sonar-scanner
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "production"'

.build-projects:
  stage: code-check-and-build
  variables:
    NODE_OPTIONS: "--max-old-space-size=2048"
    NODE_VERSION: "16.17.0"
  cache:
    paths:
      - node_modules
  image: $CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX/node:$NODE_VERSION
  script:
    - node -v
    - cd $PROJECT
    - npm install
    - npm install -g @quasar/cli
    - export NODE_OPTIONS="$NODE_OPTIONS" 
    - if [ "$CI_COMMIT_BRANCH" == "staging" ]; then npm run build:staging; elif [ "$CI_COMMIT_BRANCH" == "test" ]; then npm run build:test; else npm run build:prod; fi
  artifacts:
   untracked: true
   expire_in: 24 hrs
   exclude:
     - $CI_PROJECT_DIR/$PROJECT/node_modules/**/*
  rules:
    - if: '$CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "production"'
      changes:
        - $PROJECT/**/*

.docker-build:
  stage: build-image
  script:
    - cd $PROJECT
    - export REGISTRY_IMAGE=$CI_REGISTRY_IMAGE/$PROJECT
    - docker login -u $CI_DEPENDENCY_PROXY_USER -p $CI_DEPENDENCY_PROXY_PASSWORD $CI_DEPENDENCY_PROXY_SERVER
    - docker build --build-arg image_proxy=$CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX -t $REGISTRY_IMAGE:${CI_COMMIT_REF_NAME/\//-}-$(date +%s) . --no-cache
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push -a $REGISTRY_IMAGE
  rules:
    - if: '$CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "production"'
      changes:
        - $PROJECT/**/*

.s3-deploy:
  stage: deploy
  variables:
    SITE_CODE: ""
  image: amazon/aws-cli
  script:
    - if [ "$CI_COMMIT_BRANCH" == "test" ]; then export BUCKET=p8s1-dev-$PROJECT; elif [ "$CI_COMMIT_BRANCH" == "staging" ]; then export BUCKET=p8s1-$CI_COMMIT_BRANCH-$PROJECT; elif [ "$CI_COMMIT_BRANCH" == "production" ] && [ "$SITE_CODE" == "P8S1-BR1" ]; then export BUCKET=p8s1-br1-$PROJECT; else export BUCKET=p8s1-$PROJECT; fi
    - aws s3 sync $PROJECT s3://$BUCKET
  rules:
    - if: '$CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "production"'
      changes:
        - $PROJECT/**/*

stages:
  - code-check-and-build
  - build-image
  - deploy

code-check:
  extends: .sonarqube-check

