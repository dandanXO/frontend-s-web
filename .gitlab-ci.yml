image: docker:20.10.16
services:
  - name: docker:20.10.16-dind
    alias: docker
    command: [ "--tls=false" ]
variables:
   DOCKER_DRIVER: overlay2
   DOCKER_TLS_CERTDIR: ""
   DOCKER_HOST: tcp://docker:2375
   #ENVIRONMENT: $ENVIRONMENT
   NAMESPACE: xinfa

stages:
  - build
  - docker-build
  - deploy

build-ph-static-h5:
  stage: build
  cache:
    paths:
      - node_modules
  tags:
    - xinfa-runner
  image: node:16.17.0
  script:
    - cd ph-static-h5
    - npm install
    - npm install -g @quasar/cli
    - quasar build
  artifacts:
    untracked: true
    expire_in: 24 hrs
    exclude:
      - $CI_PROJECT_DIR/ph-static-h5/node_modules/**/*

build-image-ph-static-h5:
  stage: docker-build
  tags:
    - xinfa-runner
  script:
    - cd ph-static-h5
    - docker build -t $IMAGE_NAME . --no-cache
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $IMAGE_NAME
  variables:
    IMAGE_NAME: git.caspen-tech.com:5050/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME:ph-static-h5-$CI_COMMIT_SHORT_SHA
  needs:
    - build-ph-static-h5
#  rules:
#    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "production"'

deploy-prod-ph-static-h5:
  stage: deploy
  tags:
    - xinfa-runner
  image:
    name: bitnami/kubectl:latest
    entrypoint: ['']
  script:
    - kubectl config get-contexts
    - kubectl config use-context jolly88-complex/xf-kubernetes-agent:xf-agent
    - kubectl rollout restart deployment/xf-static-h5 -n $NAMESPACE
#  variables:
#    FRONTEND_PROJECT_NAME: ph-static-h5
#    FRONTEND_URL: ph-h5.jolly88-ph01.com
  needs:
    - build-image-ph-static-h5
#  rules:
#    - if: '$CI_COMMIT_BRANCH == "production"'

